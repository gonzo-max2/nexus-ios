# XcodeGen spec — generates NexusSelfMonitor.xcodeproj reproducibly.
#   brew install xcodegen && xcodegen generate
name: NexusSelfMonitor
options:
  bundleIdPrefix: com.nexus.selfmonitor
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
  xcodeVersion: "15.4"
settings:
  base:
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    NEXUS_APP_GROUP: group.com.nexus.selfmonitor
    # Cross-network defaults, injected at build time from the environment so the
    # ingest token never lands in git. Provide them like:
    #   NEXUS_SERVER_URL=https://host NEXUS_INGEST_TOKEN=xxx xcodebuild ...
    # Leave empty to build a shareable artifact with no baked-in credentials;
    # the user can then enter them once on the Settings screen.
    NEXUS_SERVER_URL: ""
    NEXUS_INGEST_TOKEN: ""
    # For on-device builds set your 10-char Team ID (Xcode > Settings > Accounts).
    # Leave empty to build for the Simulator without signing.
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
targets:
  NexusSelfMonitor:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Shared
      - path: Resources
        buildPhase: resources
        excludes:
          - "Info.plist"
          - "*.entitlements"
    dependencies:
      - target: ScreenBroadcast
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nexus.selfmonitor.app
        INFOPLIST_FILE: Resources/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        # Transparent AppIcon (Assets.xcassets) keeps the Home Screen tile blank
        # on test devices; see "Hiding the app" in ../BUILD.md.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
        ENABLE_PREVIEWS: YES
        CODE_SIGN_ENTITLEMENTS: Resources/ScreenSharing.entitlements
  ScreenBroadcast:
    type: app-extension
    platform: iOS
    sources:
      - path: BroadcastExtension
        excludes: [Info.plist]
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nexus.selfmonitor.app.screen
        INFOPLIST_FILE: BroadcastExtension/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        APPLICATION_EXTENSION_API_ONLY: YES
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_ENTITLEMENTS: Resources/ScreenSharing.entitlements
        SKIP_INSTALL: YES
  NexusSelfMonitorTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: NexusSelfMonitor
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  NexusSelfMonitor:
    build:
      targets:
        NexusSelfMonitor: all
        NexusSelfMonitorTests: [test]
    test:
      targets:
        - NexusSelfMonitorTests
