name: Build iOS App

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build NexusSelfMonitor (iOS)
    runs-on: macos-14

    permissions:
      contents: read

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Verify hidden-app configuration (repository sources)
        run: python3 scripts/verify_hidden_app.py

      - name: Select Xcode Version
        run: |
          if [ -d "/Applications/Xcode_16.2.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.2.app/Contents/Developer
          elif [ -d "/Applications/Xcode_16.1.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.1.app/Contents/Developer
          elif [ -d "/Applications/Xcode_16.0.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.0.app/Contents/Developer
          elif [ -d "/Applications/Xcode_15.4.app" ]; then
            sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer
          fi
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project
        working-directory: NexusSelfMonitor
        run: xcodegen generate

      - name: Build for iOS Simulator (iPhone 15)
        working-directory: NexusSelfMonitor
        run: |
          xcodebuild build \
            -project NexusSelfMonitor.xcodeproj \
            -scheme NexusSelfMonitor \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Release \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Build Unsigned Generic iOS Device Archive (.app)
        working-directory: NexusSelfMonitor
        env:
          NEXUS_SERVER_URL: ${{ secrets.NEXUS_SERVER_URL }}
          NEXUS_INGEST_TOKEN: ${{ secrets.NEXUS_INGEST_TOKEN }}
        run: |
          xcodebuild build \
            -project NexusSelfMonitor.xcodeproj \
            -scheme NexusSelfMonitor \
            -destination 'generic/platform=iOS' \
            -configuration Release \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            NEXUS_SERVER_URL="$NEXUS_SERVER_URL" \
            NEXUS_INGEST_TOKEN="$NEXUS_INGEST_TOKEN" \
            SYMROOT=build

      - name: Verify hidden-app configuration (built .app bundle)
        working-directory: NexusSelfMonitor
        run: python3 ../scripts/verify_hidden_app.py --app build/Release-iphoneos/NexusSelfMonitor.app

      - name: Run native regression tests
        working-directory: NexusSelfMonitor
        run: |
          SIMULATOR_ID=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(x["udid"] for runtime, devices in d["devices"].items() if "iOS" in runtime for x in devices if x["name"].startswith("iPhone")))')
          xcodebuild test \
            -project NexusSelfMonitor.xcodeproj \
            -scheme NexusSelfMonitor \
            -destination "platform=iOS Simulator,id=$SIMULATOR_ID" \
            -resultBundlePath TestResults.xcresult \
            CODE_SIGNING_ALLOWED=NO

      - name: Upload native test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: NexusSelfMonitor-test-results
          path: NexusSelfMonitor/TestResults.xcresult
          if-no-files-found: ignore

      - name: Package Payload into Unsigned IPA
        working-directory: NexusSelfMonitor
        run: |
          mkdir -p build/Payload
          cp -r build/Release-iphoneos/NexusSelfMonitor.app build/Payload/
          cd build && zip -r NexusSelfMonitor-unsigned.ipa Payload
          cd ..

      - name: Verify hidden-app configuration (packaged IPA)
        working-directory: NexusSelfMonitor
        run: python3 ../scripts/verify_hidden_app.py --app build/NexusSelfMonitor-unsigned.ipa

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NexusSelfMonitor-unsigned-ipa
          path: NexusSelfMonitor/build/NexusSelfMonitor-unsigned.ipa
          retention-days: 14

  server-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify hidden-app configuration (repository sources)
        run: python3 scripts/verify_hidden_app.py
      - run: npm test
        working-directory: server
